services:
  caddy-editor:
    build: .
    restart: unless-stopped
    ports:
      - "9090:9090"
    env_file:
      - .env
    environment:
      - CADDY_API_URL=http://caddy:2019
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-backups:/backups
      - caddy-logs:/var/log/caddy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.11.3-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
  caddy-backups:
  caddy-logs:
