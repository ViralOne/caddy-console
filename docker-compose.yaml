services:
  caddy-console:
    image: ghcr.io/viralone/caddy-console:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - AUTH_MODE
      - SECRET_KEY
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - CF_ACCESS_TEAM_DOMAIN
      - CF_ACCESS_AUD
      - ALLOWED_DOMAIN
      - ALLOWED_EMAILS
      - SESSION_TIMEOUT_HOURS
      - SESSION_COOKIE_SECURE
      - SERVER_URL
      - CADDYFILE_PATH
      - CADDY_LOG_FILE
      - CADDY_EXPLORE_MAX_EVENTS
      - CADDY_CACHE_TTL
      - CADDY_CMD_TIMEOUT
      - BACKUP_DIR
      - BACKUP_KEEP
      - AUDIT_LOG
      - AUDIT_LOG_MAX_BYTES
      - GEOIP_DIR
      - GEOIP_AUTO_UPDATE
      - GUNICORN_WORKERS
      - GUNICORN_THREADS
      - GUNICORN_TIMEOUT
      - GUNICORN_PRELOAD
      - CADDY_API_URL=http://caddy:2019
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-backups:/backups
      - caddy-logs:/var/log/caddy
      # IP location databases, refreshed monthly; kept so a rebuild does not re-download.
      - caddy-geoip:/data/geoip
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy-data:
  caddy-config:
  caddy-backups:
  caddy-logs:
  caddy-geoip:
