<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token }}">
<title>Caddy Console</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

{% include "_icons.html" %}

<div class="header">
  <a class="brand" data-view="dashboard" href="/">
    <!-- Same geometry as static/img/icon.svg, inlined rather than referenced as
         an image file so it takes the brand's colour on hover. -->
    <svg class="brand-mark" viewBox="0 0 32 32" width="20" height="20"
         aria-hidden="true" focusable="false">
      <path d="M6 26V16a10 10 0 0 1 20 0v10" fill="none" stroke="currentColor"
            stroke-width="3" stroke-linecap="round"/>
      <g fill="currentColor">
        <rect x="10.5" y="18" width="3" height="8" rx="1.5"/>
        <rect x="14.5" y="14" width="3" height="12" rx="1.5"/>
        <rect x="18.5" y="21" width="3" height="5" rx="1.5"/>
      </g>
    </svg>
    <span>Caddy Console</span>
  </a>

  <nav class="tabs">
    <a class="tab" data-view="dashboard" href="/">
      <svg class="icon" width="15" height="15" aria-hidden="true" focusable="false"><use href="#i-dashboard"/></svg>Dashboard</a>
    <a class="tab" data-view="editor" href="/editor">
      <svg class="icon" width="15" height="15" aria-hidden="true" focusable="false"><use href="#i-editor"/></svg>Editor</a>
    <a class="tab" data-view="explore" href="/explore">
      <svg class="icon" width="15" height="15" aria-hidden="true" focusable="false"><use href="#i-explore"/></svg>Explore</a>
  </nav>

  <span class="spacer"></span>

  <!-- Editor-only actions. Hidden on the other views, where none of them apply. -->
  <div class="view-actions" data-for-view="editor">
    <!-- Tools, grouped and quiet: they open things rather than change the file. -->
    <div class="tool-group">
      <button class="btn btn-tool" data-act="find" title="Find and replace (Cmd/Ctrl + F)">Find</button>
      <button class="btn btn-tool" id="panel-btn-snippets" data-panel="snippets" title="Insert a Caddyfile snippet">Snippets</button>
      <button class="btn btn-tool" id="panel-btn-backups" data-panel="backups" title="Browse and restore backups">Backups</button>
    </div>
    <!-- One primary action. Validate supports it, so it is outlined, not filled. -->
    <button class="btn btn-outline" data-act="validate" title="Check and format without saving">Validate</button>
    <button class="btn btn-primary" data-act="save" id="btn-save" title="Save and reload Caddy (Cmd/Ctrl + S)">
      <span id="save-label">Save &amp; Reload</span>
    </button>
  </div>

  <div class="user-menu" id="user-menu"></div>
  <!-- Kept for the save/rollback paths, which read the signed-in email from it. -->
  <span class="user-info" id="user-info" hidden></span>
</div>

<div class="warnings" id="warnings"></div>

<div class="main">
  <div class="tab-content" id="tab-editor">
    <div class="search-bar" id="search-bar">
      <input type="text" id="search-input" placeholder="Find... (Enter next, Shift+Enter previous, Esc to close)">
      <button class="btn btn-secondary btn-sm" data-act="search-prev" title="Previous match (Shift+Enter)">&uarr;</button>
      <button class="btn btn-secondary btn-sm" data-act="search-next" title="Next match (Enter)">&darr;</button>
      <span class="match-count" id="match-count"></span>
      <input type="text" id="replace-input" placeholder="Replace with...">
      <button class="btn btn-secondary btn-sm" data-act="replace-one">Replace</button>
      <button class="btn btn-secondary btn-sm" data-act="replace-all">Replace All</button>
      <button class="btn btn-secondary btn-sm" data-act="search-close">&times;</button>
    </div>
    <div class="editor-wrap" id="cm-editor" style="flex:1"></div>
  </div>

  <div class="tab-content" id="tab-dashboard">
    <div class="dash-scroll" id="dashboard-root"></div>
  </div>

  <div class="tab-content" id="tab-explore">
    <div id="explore-root"></div>
  </div>

</div>

<div class="footer">
  <span class="status-dot green" id="status-dot"></span>
  <span class="status-msg" id="status-msg">Loading...</span>
  <span class="spacer"></span>
  <span class="footer-meta" id="last-saved"></span>
  <span class="footer-meta" id="doc-stats"></span>
  <span class="footer-meta" id="cursor-pos">Ln 1, Col 1</span>
</div>

<!-- Snippets Panel -->
<div class="panel" id="panel-snippets">
  <div class="panel-header"><h3>Snippets &amp; Templates</h3><button class="panel-close" data-close="snippets">&times;</button></div>
  <div class="panel-body" id="snippets-list"></div>
</div>

<!-- Backups Panel -->
<div class="panel" id="panel-backups">
  <div class="panel-header"><h3>Backups</h3><button class="panel-close" data-close="backups">&times;</button></div>
  <div class="panel-body">
    <div id="backups-list"></div>
    <div id="backup-preview" style="display:none">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <button class="btn btn-secondary" data-act="close-preview" style="padding:4px 10px">&larr; Back</button>
        <span id="preview-name"></span>
      </div>
      <div style="display:flex;gap:4px;margin-bottom:10px">
        <button class="btn btn-tab" id="tab-btn-preview" data-ptab="preview">Preview</button>
        <button class="btn btn-tab active" id="tab-btn-diff" data-ptab="diff">Diff</button>
      </div>
      <div id="preview-content"></div>
      <div id="diff-content"></div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <button class="btn btn-save" data-act="rollback-preview">Rollback (restore + reload)</button>
        <button class="btn btn-secondary" data-act="restore-preview">Load to Editor</button>
        <button class="btn btn-secondary" data-act="close-preview">Cancel</button>
      </div>
    </div>
  </div>
</div>

<!-- Audit Panel -->

<!-- Status Panel -->

<!-- Save Diff Modal -->
<div class="modal-overlay" id="save-diff-modal">
  <div class="modal">
    <div class="modal-header">
      <h3>Review changes before saving</h3>
      <span class="modal-sub">Comparing your editor (new) against the live config on disk (current)</span>
    </div>
    <div class="modal-body" id="save-diff-content"></div>
    <div class="modal-footer">
      <button class="btn btn-save" data-act="confirm-save">Save &amp; Reload</button>
      <button class="btn btn-secondary" data-act="cancel-save">Cancel</button>
    </div>
  </div>
</div>

<script src="/static/js/editor.bundle.js"></script>
<!-- App scripts: load order matters (classic scripts share one global scope;
     csrf first, core before features, events last because it calls init()). -->
<script type="module" src="/static/js/app/main.js"></script>
</body>
</html>
