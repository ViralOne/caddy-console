<!-- Icon sprite, inlined once per page.
     Inlined rather than referenced as /static/img/icons.svg because an external
     <use href> costs a second request and has a long history of browser quirks;
     inline, a <use> is just a DOM lookup.

     Every symbol is drawn on the same 24 grid with a 2px stroke and round caps,
     so they sit at one optical weight beside 15px text. Strokes inherit
     currentColor from .icon, which is why a facet row's state colour reaches its
     checkbox without a second rule. Filled parts opt in explicitly. -->
<svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Views -->
    <symbol id="i-dashboard" viewBox="0 0 24 24">
      <path d="M3 12h3.5L9 5.5 13 18.5l2.5-6.5H21"/>
    </symbol>
    <symbol id="i-editor" viewBox="0 0 24 24">
      <path d="M9.5 4c-2 0-1 7-4.5 8 3.5 1 2.5 8 4.5 8"/>
      <path d="M14.5 4c2 0 1 7 4.5 8-3.5 1-2.5 8-4.5 8"/>
    </symbol>
    <symbol id="i-explore" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6.5"/>
      <path d="M15.8 15.8 21 21"/>
    </symbol>

    <!-- Facet states: off, only this, everything but this. Three distinct
         shapes, so the meaning does not rest on colour alone. -->
    <symbol id="i-box" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="3.5"/>
    </symbol>
    <symbol id="i-box-check" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="3.5"/>
      <path d="m8.25 12.25 2.9 2.9 5.1-5.9"/>
    </symbol>
    <symbol id="i-box-x" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="3.5"/>
      <path d="m9.2 9.2 5.6 5.6M14.8 9.2l-5.6 5.6"/>
    </symbol>

    <!-- Controls -->
    <symbol id="i-more" viewBox="0 0 24 24">
      <g fill="currentColor" stroke="none">
        <circle cx="12" cy="5.4" r="1.7"/>
        <circle cx="12" cy="12" r="1.7"/>
        <circle cx="12" cy="18.6" r="1.7"/>
      </g>
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24">
      <path d="m6.5 9.75 5.5 5.5 5.5-5.5"/>
    </symbol>
    <symbol id="i-close" viewBox="0 0 24 24">
      <path d="m6.5 6.5 11 11M17.5 6.5l-11 11"/>
    </symbol>
    <symbol id="i-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="11" height="11" rx="2.5"/>
      <path d="M5.5 15.5V6.5A2 2 0 0 1 7.5 4.5h9"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"/>
      <path d="M12 7.2V12l3.4 2"/>
    </symbol>
    <symbol id="i-filter" viewBox="0 0 24 24">
      <path d="M4.5 5.5h15l-6 7.2v5.8l-3 1.5v-7.3z"/>
    </symbol>
    <!-- Live: a source emitting. The centre is filled so "on" reads at a
         glance, which is the whole job of this one. -->
    <symbol id="i-live" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/>
      <path d="M7.9 7.9a5.8 5.8 0 0 0 0 8.2M16.1 7.9a5.8 5.8 0 0 1 0 8.2"/>
    </symbol>
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="m5 12.6 4.7 4.7L19 6.8"/>
    </symbol>
    <symbol id="i-warning" viewBox="0 0 24 24">
      <path d="M12 4.6l8.6 14.8H3.4z"/>
      <path d="M12 10v3.8"/>
      <path d="M12 16.6h.01"/>
    </symbol>
    <symbol id="i-external" viewBox="0 0 24 24">
      <path d="M14 5h5v5"/>
      <path d="M19 5l-7.5 7.5"/>
      <path d="M17 14v3.5A1.5 1.5 0 0 1 15.5 19H6.5A1.5 1.5 0 0 1 5 17.5V8.5A1.5 1.5 0 0 1 6.5 7H10"/>
    </symbol>
    <symbol id="i-logout" viewBox="0 0 24 24">
      <path d="M9.5 19H6.5A2 2 0 0 1 4.5 17V7A2 2 0 0 1 6.5 5h3"/>
      <path d="m15.2 8.4 3.6 3.6-3.6 3.6"/>
      <path d="M18.8 12H9.5"/>
    </symbol>

  </defs>
</svg>
