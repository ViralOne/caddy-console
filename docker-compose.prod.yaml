services:
  caddy:
    # Keep in step with the caddy-bin stage in Dockerfile: the editor validates
    # with that binary, and it should match what actually loads the config.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      # Shared log dir so the editor's Logs panel can tail Caddy's access log
      - caddy-logs:/var/log/caddy
    networks:
      # `default` is where your proxied apps live (if they are containers);
      # `editor` is the only way to reach caddy-editor and the admin API.
      - default
      - editor
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy-editor:
    image: ghcr.io/viralone/caddy-web-editor:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Reach the caddy container's admin API for Save & Reload (overrides .env)
      - CADDY_API_URL=http://caddy:2019
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-backups:/backups
      - caddy-logs:/var/log/caddy
    networks:
      # Not on `default`: containers behind Caddy must not be able to reach the
      # editor (in header-trust mode anything that can would be a full admin).
      - editor
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared-caddy:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - editor
    depends_on:
      caddy-editor:
        condition: service_healthy

networks:
  default:
  # Editor, its tunnel, and Caddy only. Needs egress for the tunnel, so it
  # can't be `internal: true`; isolation comes from what is attached to it.
  editor:

volumes:
  caddy-data:
  caddy-config:
  caddy-backups:
  caddy-logs:
