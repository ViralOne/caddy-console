services:
  caddy:
    # Running a custom build (a DNS-01 plugin, say) is fine: the console
    # validates through this container's admin API, so whatever modules it has
    # are the modules a config is checked against.
    #   image: ghcr.io/caddybuilds/caddy-cloudflare:2.11.4-alpine
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      # Shared log dir so the dashboard and explorer can read Caddy's access log
      - caddy-logs:/var/log/caddy
    networks:
      # `default` is where your proxied apps live (if they are containers);
      # `console` is the only way to reach caddy-console and the admin API.
      - default
      - console
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy-console:
    image: ghcr.io/viralone/caddy-console:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Reach the caddy container's admin API for Save & Reload (overrides .env)
      - CADDY_API_URL=http://caddy:2019
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-backups:/backups
      - caddy-logs:/var/log/caddy
    networks:
      # Not on `default`: containers behind Caddy must not be able to reach the
      # console (in header-trust mode anything that can would be a full admin).
      - console
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared-caddy:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - console
    depends_on:
      caddy-console:
        condition: service_healthy

networks:
  default:
  # Console, its tunnel, and Caddy only. Needs egress for the tunnel, so it
  # can't be `internal: true`; isolation comes from what is attached to it.
  console:

volumes:
  caddy-data:
  caddy-config:
  caddy-backups:
  caddy-logs:
