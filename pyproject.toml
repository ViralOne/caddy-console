[project]
name = "caddy-editor"
version = "0.1.0"
description = "Minimal web UI to edit Caddyfile with Google OAuth"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    # <2: Cloudflare Access JWT verification uses authlib.jose, which 2.0 removes.
    "authlib>=1.7.2,<2",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = []
