# Local development stack. NOT for deployment.
#
#   ./dev/run.sh up      start it and print the URL
#   ./dev/run.sh down    stop it and remove volumes
#
# There is no real authentication here: caddy-front injects the identity header
# that Cloudflare Access would normally set, so anyone who can reach the port is
# a logged-in editor. Every published port is therefore bound to 127.0.0.1.
name: caddy-editor-dev

services:
  # Stands in for Cloudflare Access, and is the only entrypoint you browse to.
  caddy-front:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:80"
    volumes:
      - ./dev/Caddyfile.front:/etc/caddy/Caddyfile:ro
    depends_on:
      - caddy-editor

  caddy-editor:
    build: .
    restart: unless-stopped
    # --reload picks up Python edits; the bind mount below makes CSS/JS/template
    # edits show up on refresh instead of needing an image rebuild.
    command: ["uv", "run", "gunicorn", "app:app", "-b", "0.0.0.0:9090", "--access-logfile", "-", "-c", "gunicorn.conf.py", "--reload"]
    environment:
      AUTH_MODE: cloudflare
      ALLOWED_EMAILS: dev@local
      SECRET_KEY: dev-only-not-a-real-secret-0123456789abcdef
      SESSION_COOKIE_SECURE: "false"
      # --reload only works without app preloading (see gunicorn.conf.py).
      GUNICORN_PRELOAD: "false"
      CADDYFILE_PATH: /etc/caddy/Caddyfile
      BACKUP_DIR: /backups
      AUDIT_LOG: /backups/audit.log
      CADDY_API_URL: http://caddy-target:2019
      CADDY_LOG_FILE: /var/log/caddy/access.log
      SERVER_URL: http://localhost:8888
    volumes:
      # The editor and caddy-target must share the same Caddyfile.
      - ./dev/run/Caddyfile:/etc/caddy/Caddyfile
      - ./dev/run/backups:/backups
      - caddy-logs:/var/log/caddy
      # Live source so you don't rebuild the image on every edit. Remember to
      # re-run `npm run build` after changing files under static/js/app.
      - ./src:/app/src
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The Caddy instance whose config the editor edits and reloads.
  caddy-target:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./dev/run/Caddyfile:/etc/caddy/Caddyfile
      - caddy-logs:/var/log/caddy
      - caddy-target-data:/data
      - caddy-target-config:/config
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy-logs:
  caddy-target-data:
  caddy-target-config:
