# Temporary synthetic-login stack for local transition work. See README:
# "Internal stack". The console proxy is loopback-only; use an SSH local port
# forward when administering it from another machine.
services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - /opt/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      - caddy-public
      - caddy-admin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy-console:
    image: ${CADDY_CONSOLE_IMAGE:?Set immutable CADDY_CONSOLE_IMAGE}
    restart: unless-stopped
    read_only: true
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      - AUTH_MODE=cloudflare
      - UNSAFE_ALLOW_UNVERIFIED_CF_HEADER=true
      - ALLOWED_EMAILS=admin@local
      - SESSION_COOKIE_SECURE=false
      - CADDY_API_URL=http://caddy:2019
      - SECRET_KEY
      - CADDYFILE_PATH
      - CADDY_LOG_FILE
      - CADDY_EXPLORE_MAX_EVENTS
      - CADDY_CACHE_TTL
      - CADDY_CMD_TIMEOUT
      - BACKUP_DIR
      - BACKUP_KEEP
      - AUDIT_LOG
      - AUDIT_LOG_MAX_BYTES
      - GEOIP_DIR
      - GEOIP_AUTO_UPDATE
      - GUNICORN_WORKERS
      - GUNICORN_THREADS
      - GUNICORN_TIMEOUT
      - GUNICORN_PRELOAD
    volumes:
      - /opt/caddy:/etc/caddy
      - caddy-backups:/backups
      - caddy-logs:/var/log/caddy:ro
      - caddy-geoip:/data/geoip
    networks:
      - caddy-admin
      - console-ui
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:9090/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3

  console-proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /data:size=16m,mode=0755
      - /config:size=16m,mode=0755
    command:
      - caddy
      - reverse-proxy
      - --from
      - :8888
      - --to
      - caddy-console:9090
      - --header-up
      - "Cf-Access-Authenticated-User-Email: admin@local"
    environment:
      - CADDY_ADMIN=off
    ports:
      - "8888:8888"
    networks:
      - console-ui
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      caddy-console:
        condition: service_healthy

networks:
  caddy-public:
  caddy-admin:
    internal: true
  console-ui:

volumes:
  caddy-data:
  caddy-config:
  caddy-backups:
  caddy-logs:
  caddy-geoip:
