# Temporary no-login stack for a trusted LAN. See README: "Internal stack".
services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - /opt/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      - console
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy-console:
    image: ghcr.io/viralone/caddy-console:latest
    restart: unless-stopped
    environment:
      - AUTH_MODE=cloudflare
      - ALLOWED_EMAILS=admin@local
      - SESSION_COOKIE_SECURE=false
      - CADDY_API_URL=http://caddy:2019
      - SECRET_KEY
      - CADDYFILE_PATH
      - CADDY_LOG_FILE
      - CADDY_EXPLORE_MAX_EVENTS
      - CADDY_CACHE_TTL
      - CADDY_CMD_TIMEOUT
      - BACKUP_DIR
      - BACKUP_KEEP
      - AUDIT_LOG
      - AUDIT_LOG_MAX_BYTES
      - GEOIP_DIR
      - GEOIP_AUTO_UPDATE
      - GUNICORN_WORKERS
      - GUNICORN_THREADS
      - GUNICORN_TIMEOUT
      - GUNICORN_PRELOAD
    volumes:
      - /opt/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-backups:/backups
      - caddy-logs:/var/log/caddy
      - caddy-geoip:/data/geoip
    networks:
      - console
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  console-proxy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    command:
      - caddy
      - reverse-proxy
      - --from
      - :8888
      - --to
      - caddy-console:9090
      - --header-up
      - "Cf-Access-Authenticated-User-Email: admin@local"
    environment:
      - CADDY_ADMIN=off
    ports:
      - "8888:8888"
    networks:
      - console
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      caddy-console:
        condition: service_healthy

networks:
  console:

volumes:
  caddy-data:
  caddy-config:
  caddy-backups:
  caddy-logs:
  caddy-geoip:
