# Transition stack: Caddy beside Nginx on 8080/8443, console behind Google
# OAuth. The console has no published port; the Caddy in this stack serves it
# on a LAN-only hostname (see README: "Internal stack"). Never publish 9090 or
# 2019.
services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "8080:80"
      - "8443:443"
      - "8443:443/udp"
    volumes:
      - /opt/caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      - caddy-public
      - caddy-admin
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy-console:
    image: ${CADDY_CONSOLE_IMAGE:?Set immutable CADDY_CONSOLE_IMAGE}
    restart: unless-stopped
    read_only: true
    user: "0:0"
    cap_add:
      - DAC_OVERRIDE
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      - AUTH_MODE=google
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      # LAN-only HTTPS hostname served by this stack's Caddy, e.g.
      # https://caddy-console.example.com. Register ${SERVER_URL}/auth/callback.
      - SERVER_URL=${SERVER_URL:?Set SERVER_URL}
      - ALLOWED_DOMAIN
      - ALLOWED_EMAILS
      - SESSION_TIMEOUT_HOURS
      - CADDY_API_URL=http://caddy:2019
      - CADDYFILE_PATH
      - CADDY_LOG_FILE
      - CADDY_EXPLORE_MAX_EVENTS
      - CADDY_CACHE_TTL
      - CADDY_CMD_TIMEOUT
      - BACKUP_DIR
      - BACKUP_KEEP
      - AUDIT_LOG
      - AUDIT_LOG_MAX_BYTES
      - GEOIP_DIR
      - GEOIP_AUTO_UPDATE
      - GUNICORN_WORKERS
      - GUNICORN_THREADS
      - GUNICORN_TIMEOUT
      - GUNICORN_PRELOAD
    volumes:
      - /opt/caddy:/etc/caddy
      - caddy-backups:/backups
      - caddy-logs:/var/log/caddy:ro
      - caddy-geoip:/data/geoip
    # No published port. caddy-admin (shared with Caddy only) carries both
    # Caddy's proxy to the console and the console's admin API calls;
    # console-ui is egress for Google's token endpoint and GeoIP updates.
    networks:
      - caddy-admin
      - console-ui
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:9090/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  caddy-public:
  caddy-admin:
    internal: true
  console-ui:

volumes:
  caddy-data:
  caddy-config:
  caddy-backups:
  caddy-logs:
  caddy-geoip:
